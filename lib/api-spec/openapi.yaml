openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dishes:
    get:
      operationId: listDishPhotos
      tags: [dishes]
      summary: List National Harbor dish photos
      responses:
        "200":
          description: Dish photos, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishPhoto"
    post:
      operationId: uploadDishPhoto
      tags: [dishes]
      summary: Upload a National Harbor dish photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishPhotoInput"
      responses:
        "201":
          description: The saved dish photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPhoto"
        "400":
          description: Invalid title or image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Image or request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported image format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dishes/{id}/image:
    get:
      operationId: getDishPhotoImage
      tags: [dishes]
      summary: Get a dish photo image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The original image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Dish photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat/system-prompt:
    get:
      operationId: getCityGuideSystemPrompt
      tags: [city-guide]
      summary: Get the city guide system prompt
      responses:
        "200":
          description: The system prompt used by the National Harbor guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityGuideSystemPrompt"
  /chat:
    post:
      operationId: sendCityGuideMessage
      tags: [city-guide]
      summary: Ask the National Harbor city guide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityGuideChatInput"
      responses:
        "200":
          description: The generated city guide reply and usage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityGuideChatResponse"
        "400":
          description: The request body is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The model request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The Gemini API key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DishPhoto:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: string
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, caption, imageUrl, createdAt]
    DishPhotoInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        caption:
          type: string
          maxLength: 500
        image:
          type: string
          format: uri
          maxLength: 4194327
      required: [title, image]
    CityGuideSystemPrompt:
      type: object
      properties:
        prompt:
          type: string
      required: [prompt]
    CityGuideChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CityGuideChatMessage"
        settings:
          $ref: "#/components/schemas/CityGuideSettingsInput"
      required: [message]
    CityGuideChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required: [role, content]
    CityGuideSettingsInput:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        maxOutputTokens:
          type: integer
          minimum: 32
          maximum: 1024
    CityGuideChatSettings:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        maxOutputTokens:
          type: integer
          minimum: 32
          maximum: 1024
      required: [temperature, topP, maxOutputTokens]
    CityGuideUsage:
      type: object
      properties:
        promptTokenCount:
          type: integer
          minimum: 0
        candidatesTokenCount:
          type: integer
          minimum: 0
        totalTokenCount:
          type: integer
          minimum: 0
      required: [promptTokenCount, candidatesTokenCount, totalTokenCount]
    CityGuideChatResponse:
      type: object
      properties:
        reply:
          type: string
        usage:
          $ref: "#/components/schemas/CityGuideUsage"
        settings:
          $ref: "#/components/schemas/CityGuideChatSettings"
        model:
          type: string
        truncated:
          type: boolean
      required: [reply, usage, settings, model, truncated]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

